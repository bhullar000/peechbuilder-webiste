name: Deploy static site

on:
  push:
    branches:
      - prod-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-deploy
  cancel-in-progress: true

env:
  S3_TARGET: s3://kive-media/peechbuilder-com/
  CONTACT_LAMBDA: peechbuilder

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: |
          if [ -z "$NUXT_PUBLIC_CONTACT_ENDPOINT" ]; then echo "::error::Set the CONTACT_ENDPOINT repo variable to the Lambda Function URL"; exit 1; fi
          npm run generate
        env:
          NUXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy contact form Lambda
        run: |
          cd lambda/contact
          zip -q ../contact.zip index.mjs send.mjs
          aws lambda update-function-code --function-name "$CONTACT_LAMBDA" --zip-file fileb://../contact.zip > /dev/null
          aws lambda wait function-updated --function-name "$CONTACT_LAMBDA"

      - name: Upload site to S3
        run: |
          # Assets: let the CLI infer types, but don't touch HTML here
          aws s3 sync .output/public/ "$S3_TARGET" --delete --exclude "*.html"
          # HTML: always re-upload with an explicit content type so browsers render instead of download
          aws s3 cp .output/public/ "$S3_TARGET" --recursive \
            --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
